[general]
bars = 32
framerate = 30
autosens = 1
scaling = linear
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = portaudio
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 60

[eq]
1 = 0.80
2 = 0.90
3 = 1.40
4 = 2.40
5 = 3.50
6 = 2.40
7 = 1.60
8 = 1.20
9 = 1.00
